# Whole Cloudnivo stack on this PC:
#   web    – the site at http://localhost:8080
#   worker – clipping and generation jobs (from worker/)
#   ollama – local model the worker uses
# Start:  docker compose up -d --build      Stop: docker compose down
# Same project name as worker/ so existing containers are reused.
name: worker

include:
  - worker/docker-compose.yml

services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "8080:80"
    restart: unless-stopped
    mem_limit: 128m
