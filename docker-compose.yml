# Whole Cloudnivo stack on this PC:
#   web    – the site at http://localhost:8080
#   worker – clipping and generation jobs (from worker/)
#   ollama – local model the worker uses
#
# Start or update:   docker compose up -d --build web
#                    (web rebuilds in about a minute; worker and ollama start as they are)
# Update the worker: docker build -f worker/Dockerfile.update -t worker-worker:latest worker
#                    docker compose up -d --no-build worker
# Stop everything:   docker compose down
#
# Same project name as worker/ so the running containers are reused.
name: worker

include:
  - worker/docker-compose.yml

services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "8080:80"
    restart: unless-stopped
    mem_limit: 128m
