# Deploys the web app to Cloudflare Pages on every push (main = production, other branches = previews).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit")
# and CLOUDFLARE_ACCOUNT_ID. Vercel keeps deploying in parallel until DNS is switched.
name: Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - name: Create the Pages project on first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages project create cloudnivo --production-branch main || true
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name cloudnivo --branch "${GITHUB_REF_NAME}"
